<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Editable PIP ownership fixture</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #101624; }
#stage { position: relative; width: 360px; height: 640px; overflow: hidden; background: #e7eef5; }
#speaker { position: absolute; left: 0; top: 0; width: 360px; height: 640px; object-fit: cover; object-position: 50% 50%; border-radius: 0; z-index: 1; }
.visual-host { position: absolute; inset: 0; width: 360px; height: 640px; z-index: 5; }
.effect-root { position: absolute; inset: 0; overflow: hidden; background: #1c385c; color: white; }
.effect-root .material { position: absolute; left: 24px; top: 28px; width: 312px; font: 32px system-ui; }
.speaker-pip-frame { position: absolute; left: 0; top: 0; width: 360px; height: 640px; overflow: hidden; border-radius: 0; background: #687fa0; }
.speaker-pip-frame video { width: 100%; height: 100%; object-fit: cover; object-position: 50% 28%; }
</style>
<div id="stage" data-composition-id="finecut-root" data-start="0" data-duration="6" data-width="360" data-height="640">
  <video id="speaker" class="clip speaker-clip" src="public/synthetic.webm" muted playsinline data-start="0" data-duration="6" data-media-start="0" data-track-index="0" data-volume="0"></video>
  <div id="pip-host" class="visual-host clip" data-composition-id="editable-pip" data-composition-src="compositions/editable-pip.html" data-start="1" data-duration="4" data-track-index="3" data-width="360" data-height="640"></div>
</div>
<template id="pip-template">
  <div class="effect-root" data-composition-id="editable-pip" data-width="360" data-height="640">
    <div class="material">Synthetic material<br>01 / 02 / 03</div>
    <div class="speaker-pip-frame" data-aip-editable="speaker-pip-frame">
      <video id="effect-speaker" data-pip-src="public/synthetic.webm" data-start="1" data-duration="4" data-media-start="1" muted playsinline data-volume="0"></video>
    </div>
  </div>
</template>
<script src="public/vendor/gsap.min.js"></script>
<script>
window.__timelines = window.__timelines || {};
const rootTl = gsap.timeline({ paused: true });
window.__timelines['finecut-root'] = rootTl;
const host = document.querySelector('#pip-host');
host.appendChild(document.querySelector('#pip-template').content.cloneNode(true));
const frame = host.querySelector('.speaker-pip-frame');
const pipTl = gsap.timeline({ paused: true });
const full = { left: 0, top: 0, width: 360, height: 640, borderRadius: 0 };
const pip = { left: 24, top: 340, width: 312, height: 276, borderRadius: 30 };
pipTl.to(frame, { ...pip, duration: 0.6, ease: 'power2.inOut' }, 0);
pipTl.to(frame, { ...full, duration: 0.6, ease: 'power2.inOut' }, 3.4);
window.__timelines['editable-pip'] = pipTl;
window.seekGlobal = function (time) {
  rootTl.seek(time);
  const liveHost = document.querySelector('#pip-host');
  if (!liveHost) return;
  const start = Number(liveHost.dataset.start);
  const duration = Number(liveHost.dataset.duration);
  const active = time >= start && time < start + duration;
  liveHost.style.display = active ? 'block' : 'none';
  if (active) pipTl.seek(time - start);
};
window.moveHost = function (start) {
  const liveHost = document.querySelector('#pip-host');
  liveHost.dataset.start = String(start);
  liveHost.querySelector('[data-pip-src]').dataset.start = String(start);
};
window.deleteHost = function () {
  document.querySelector('#pip-host')?.remove();
};
window.seekGlobal(0);
</script></html>
