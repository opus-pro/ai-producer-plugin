<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180" fill="none" role="img" aria-labelledby="title description">
  <title id="title">From footage to an editable preview</title>
  <desc id="description">One: attach your talking-head video. Two: describe the edit to your coding agent. Three: open the editable preview to review and adjust. Export an MP4 when you ask.</desc>
  <rect x=".5" y=".5" width="1199" height="179" rx="20" fill="#131519" stroke="#363944"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <circle cx="55" cy="57" r="19" fill="#2E3540"/>
    <text x="55" y="63" fill="#EDECF1" text-anchor="middle" font-size="16" font-weight="700">1</text>
    <text x="87" y="64" fill="#F5F4F8" font-size="22" font-weight="700">Bring your footage</text>
    <text x="36" y="106" fill="#B8BAC5" font-size="17">Attach a talking-head video.</text>
    <text x="36" y="134" fill="#B8BAC5" font-size="17">Start in Codex or Claude Code.</text>
    <path d="M371 83H393M386 76L393 83L386 90" stroke="#777C8F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="455" cy="57" r="19" fill="#393145"/>
    <text x="455" y="63" fill="#DDC9F7" text-anchor="middle" font-size="16" font-weight="700">2</text>
    <text x="487" y="64" fill="#F5F4F8" font-size="22" font-weight="700">Describe the edit</text>
    <text x="436" y="106" fill="#B8BAC5" font-size="17">Ask for cuts, captions, and graphics.</text>
    <text x="436" y="134" fill="#B8BAC5" font-size="17">Your agent prepares the preview.</text>
    <path d="M782 83H804M797 76L804 83L797 90" stroke="#777C8F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="866" cy="57" r="19" fill="#2E3A23"/>
    <text x="866" y="63" fill="#D5FF83" text-anchor="middle" font-size="16" font-weight="700">3</text>
    <text x="898" y="64" fill="#F5F4F8" font-size="22" font-weight="700">Make it yours</text>
    <text x="847" y="106" fill="#B8BAC5" font-size="17">Review and adjust in the editor.</text>
    <text x="847" y="134" fill="#D5FF83" font-size="17">Export an MP4 when you ask.</text>
  </g>
</svg>
