<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" fill="none" role="img" aria-labelledby="title description">
  <title id="title">AI Producer - Your footage. Your next great cut.</title>
  <desc id="description">Video editing for Codex and Claude Code, illustrated with an editable timeline of footage, captions, graphics, and audio.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111216"/>
      <stop offset="1" stop-color="#1B1C25"/>
    </linearGradient>
    <linearGradient id="preview" x1="946" y1="113" x2="1084" y2="263" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DFD5FD"/>
      <stop offset="1" stop-color="#8D83B4"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#FFF" stroke-opacity=".025"/>
    </pattern>
  </defs>
  <rect width="1200" height="480" rx="24" fill="url(#background)"/>
  <rect width="1200" height="480" rx="24" fill="url(#grid)"/>
