    <path d="M693 129L696 136L703 139L696 142L693 149L690 142L683 139L690 136L693 129Z" fill="#D5FF83"/>
    <text x="711" y="139" fill="#F1F0F6" font-size="12">Cut the pauses.</text>
    <text x="711" y="157" fill="#F1F0F6" font-size="12">Make the key points pop.</text>
    <text x="680" y="202" fill="#9296A6" font-size="10" letter-spacing="1.4">FROM A SIMPLE PROMPT</text>
    <text x="680" y="229" fill="#EEEDF4" font-size="18" font-weight="700">To a cut you can shape.</text>
    <text x="680" y="252" fill="#A5A7B5" font-size="12">Open it. Review it. Make it yours.</text>

