    <text x="99" y="70" fill="#FAF9F6" font-size="23" font-weight="700">AI Producer</text>
    <text x="56" y="157" fill="#BEB9CD" font-size="13" font-weight="700" letter-spacing="2.2">THE OPUSCLIP PLUGIN</text>
    <text x="53" y="224" fill="#FAF9F6" font-size="62" font-weight="700" letter-spacing="-2.5">Your footage.</text>
    <text x="53" y="294" fill="#D5FF83" font-size="62" font-weight="700" letter-spacing="-2.5">Your next great cut.</text>
    <text x="56" y="341" fill="#B8BAC5" font-size="19">Cut, caption, and animate. Just ask your agent.</text>
