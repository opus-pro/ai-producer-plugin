name: Publish release

on:
  push:
    branches: [main]
    paths: [releases/latest_version.json]

permissions: {}

# Serialize reruns of the same commit without cancelling another version's run.
concurrency:
  group: publish-release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'opus-pro/ai-producer-plugin'
    runs-on: opus-runner-standard
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Read the triggering commit
        shell: bash
        run: curl -fsSL "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/archive/$GITHUB_SHA.tar.gz" | tar -xz --strip-components=1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Create the version tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_release.py
